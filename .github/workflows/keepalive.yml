name: Keepalive Supabase

# Les projets Supabase gratuits sont mis en pause après une semaine sans activité.
# Ce ping quotidien génère une vraie requête sur l'API REST du projet.
#
# Point d'API : GET /rest/v1/cards avec la clé publishable (rôle anon).
# La table `cards` n'a volontairement AUCUN grant pour anon : PostgREST répond 401
# (« permission denied »), mais la requête traverse bien la passerelle, PostgREST et
# Postgres, ce qui compte comme activité. On ne rouvre donc aucun accès anonyme.
# Seuls un code >= 500 (projet en pause / en panne) ou l'absence de réponse font échouer le job.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping de l'API Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::Secrets manquants : SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY doivent être définis."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/cards?select=id&limit=1" -H "apikey: $KEY") || {
            echo "::error::La requête n'a pas abouti (réseau ou timeout de 30 s)."
            exit 1
          }
          echo "HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" -eq 0 ]; then
            echo "::error::Réponse $code : projet probablement en pause ou en panne."
            exit 1
          fi
