# Projet Xcode de l'app native, généré par XcodeGen : `cd apple && xcodegen` crée VaultCards.xcodeproj (non versionné).
name: VaultCards
options:
  bundleIdPrefix: io.github.kylliandelbauche
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  VaultCardsCore:
    path: VaultCardsCore
targets:
  VaultCards:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: VaultCards
        excludes: ["*.entitlements"]
    scheme: {}
    dependencies:
      - package: VaultCardsCore
    settings:
      base:
        PRODUCT_NAME: Vault Cards
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kylliandelbauche.vaultcards
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vault Cards
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Sandbox macOS : lecture et écriture des seuls fichiers et dossiers choisis par l'utilisateur (dossier de synchro).
        ENABLE_USER_SELECTED_FILES: readwrite
        # Sandbox macOS : connexions sortantes (API d'Anthropic, avec la clé de l'utilisateur).
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Boîte de réception : vocal enregistré puis transcrit sur l'appareil (sandbox macOS : entrée audio).
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Le micro sert à dicter un élément de la boîte de réception."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Le vocal est transcrit en texte sur cet appareil avant l'envoi à l'IA."
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": VaultCards/VaultCards-macOS.entitlements
